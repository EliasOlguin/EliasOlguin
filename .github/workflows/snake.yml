# Redraws the contribution snake every day and pushes it to the `output` branch.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # steel palette from eliasolguin.dev
          outputs: |
            dist/snake.svg?color_snake=#e3e5e8&color_dots=#161719,#2a2c30,#5a5f66,#9aa0a8,#e3e5e8
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
