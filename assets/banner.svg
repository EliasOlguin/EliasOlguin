<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Elias Olguin · Full-stack developer">
  <defs>
    <!-- same color tokens as eliasolguin.dev (chrome, steel-line, line) -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset=".45" stop-color="#9aa0a8"/>
      <stop offset=".55" stop-color="#e6e8eb"/>
      <stop offset="1" stop-color="#6c727a"/>
    </linearGradient>
    <linearGradient id="steelLine" x1="0" x2="1">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset=".5" stop-color="#8a8f96"/>
      <stop offset="1" stop-color="#3a3d42"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="titleClip">
      <text x="60" y="185" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="600" letter-spacing="-3">Elias Olguin</text>
    </clipPath>
    <style>
      .mono { font-family: 'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace; }
      .contour { fill: none; stroke: #2a2c30; stroke-width: 1; stroke-dasharray: 6 10; animation: flow 40s linear infinite; }
      .contour:nth-child(even) { animation-duration: 55s; animation-direction: reverse; }
      @keyframes flow { to { stroke-dashoffset: -480; } }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0%, 15% { transform: translateX(-300px); } 60%, 100% { transform: translateX(900px); } }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .contour, .sweep, .blink { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="8" fill="#0a0a0a"/>

  <!-- topographic contours (the portfolio's background), slowly flowing -->
  <g opacity=".9">
    <path class="contour" d="M640 -10 C 760 60, 700 140, 820 190 S 1010 250, 1210 210"/>
    <path class="contour" d="M690 -10 C 800 50, 760 130, 870 170 S 1040 220, 1210 180"/>
    <path class="contour" d="M740 -10 C 840 40, 820 110, 920 145 S 1070 190, 1210 150"/>
    <path class="contour" d="M800 -10 C 880 30, 880 90, 970 120 S 1100 160, 1210 120"/>
    <path class="contour" d="M860 -10 C 920 20, 940 70, 1020 95 S 1130 125, 1210 90"/>
    <path class="contour" d="M600 330 C 700 280, 820 300, 900 260 S 1080 250, 1210 270"/>
    <path class="contour" d="M660 330 C 740 295, 850 310, 930 285 S 1090 280, 1210 300"/>
    <ellipse class="contour" cx="1060" cy="60" rx="70" ry="28"/>
    <ellipse class="contour" cx="1060" cy="60" rx="38" ry="14"/>
  </g>

  <!-- spec header -->
  <text class="mono" x="60" y="62" font-size="14" fill="#959aa1" letter-spacing="2">EO-01 / DEVELOPER SPEC</text>
  <text class="mono" x="1140" y="62" font-size="14" fill="#959aa1" text-anchor="end" letter-spacing="1">54.80°S 68.30°W → 50.94°N 6.96°E</text>
  <rect x="60" y="80" width="1080" height="1" fill="url(#steelLine)"/>

  <!-- chrome title with a light sweep -->
  <text x="60" y="185" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="600" letter-spacing="-3" fill="url(#chrome)">Elias Olguin</text>
  <g clip-path="url(#titleClip)">
    <rect class="sweep" x="0" y="90" width="220" height="120" fill="url(#shine)"/>
  </g>

  <!-- subtitle -->
  <text x="62" y="232" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#e3e5e8">Full-stack developer with an industrial background.</text>
  <text class="mono" x="62" y="272" font-size="15" fill="#a3a8af">React · TypeScript  ⟶  C# · .NET · SQL<tspan class="blink" fill="#e3e5e8"> ▍</tspan></text>

  <!-- status pill -->
  <g transform="translate(940 252)">
    <rect width="200" height="32" rx="16" fill="#111214" stroke="#34363a"/>
    <circle cx="20" cy="16" r="5" fill="#e3e5e8"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <text class="mono" x="34" y="21" font-size="13" fill="#c7c9cc">available now · EU</text>
  </g>
</svg>
